{% extends "golf_handicap/base.html" %}
{% load django_bootstrap5 %}

{% block content %}

  <p>Edit score:</p>

  <form action="{% url 'golf_handicap:edit_score' score.id %}" method='post'>
    {% csrf_token %}
    {% bootstrap_form form %}
    {% bootstrap_button button_type="submit" content="Save changes" %}
  </form>

{% endblock content %}
