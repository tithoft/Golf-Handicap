{% extends 'golf_handicap/base.html' %}
{% load django_bootstrap5 %}

{% block content %}

  <p><a href="{% url 'golf_handicap:course' course.id %}">{{ course }}</a></p>

  <p>Edit course tee:</p>

  <form action="{% url 'golf_handicap:edit_tee' tee.id %}" method='post'>
    {% csrf_token %}
    {% bootstrap_form form %}
    {% bootstrap_button button_type="submit" content="Save changes" %}
  </form>

{% endblock content %}
